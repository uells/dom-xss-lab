<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM XSS Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen font-sans bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 overflow-hidden">

    <div class="absolute w-[40rem] h-[40rem] bg-[radial-gradient(circle,rgba(129,140,248,0.5),transparent_70%)] blur-[100px] -top-48 -left-48 pointer-events-none animate-blob-a"></div>
    <div class="absolute w-[36rem] h-[36rem] bg-[radial-gradient(circle,rgba(96,165,250,0.5),transparent_70%)] blur-[100px] top-1/3 -right-40 pointer-events-none animate-blob-b"></div>
    <div class="absolute w-[32rem] h-[32rem] bg-[radial-gradient(circle,rgba(192,132,252,0.45),transparent_70%)] blur-[100px] bottom-[-8rem] left-1/4 pointer-events-none animate-blob-c"></div>
    <div class="absolute w-[28rem] h-[28rem] bg-[radial-gradient(circle,rgba(96,165,250,0.4),transparent_70%)] blur-[100px] top-10 right-1/3 pointer-events-none animate-blob-a-delayed"></div>
    <div class="absolute w-[30rem] h-[30rem] bg-[radial-gradient(circle,rgba(129,140,248,0.4),transparent_70%)] blur-[100px] bottom-10 -right-32 pointer-events-none animate-blob-b-delayed"></div>

    <div class="relative min-h-screen flex gap-6 p-8">

        <aside class="self-start w-64 p-4 bg-gradient-to-br from-white/70 via-white/40 to-white/20 backdrop-blur-xl border border-white/80 rounded-2xl shadow-[0_12px_32px_-8px_rgba(0,0,0,0.15)]">
            <h1 class="text-slate-900 text-lg font-semibold mb-4">DOM XSS Lab</h1>
            <nav class="flex flex-col gap-1">
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">innerHTML</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">insertAdjacentHTML</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">document.write</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">onclick attribute</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">eval / setTimeout</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">iframe.srcdoc</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">outerHTML</a>
                <a href="#" class="px-3 py-2 rounded-lg text-slate-700 hover:bg-white/60 hover:text-slate-900 transition">document.referrer</a>
            </nav>
        </aside>

        <main class="flex-1 mb-24 p-6 bg-gradient-to-br from-white/70 via-white/40 to-white/20 backdrop-blur-xl border border-white/80 rounded-2xl shadow-[0_12px_32px_-8px_rgba(0,0,0,0.15)]">
            <h2 class="text-slate-900 text-xl font-semibold">innerHTML</h2>

            <div class="flex items-center gap-5 mt-3 mb-5">
                <div>
                    <div class="text-[10px] uppercase tracking-widest text-slate-400">Источник</div>
                    <div class="font-mono text-sm text-slate-700">location.search</div>
                </div>
                <div class="text-slate-300">→</div>
                <div>
                    <div class="text-[10px] uppercase tracking-widest text-slate-400">Приёмник</div>
                    <div class="font-mono text-sm text-slate-700">element.innerHTML</div>
                </div>
            </div>

            <div class="w-fit rounded-xl overflow-hidden shadow-md border border-white/10">
                <div class="flex items-center gap-1.5 px-3 py-2 bg-[#211d36]">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-400/80"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-yellow-400/80"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-green-400/80"></span>
                </div>
                <pre class="font-mono text-sm bg-[#1a1728] text-indigo-100 px-4 py-3 overflow-x-auto"><code>element.innerHTML = payload;</code></pre>
            </div>
        </main>

    </div>

</body>
</html>
